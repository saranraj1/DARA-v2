[tool.poetry]
name = "dara"
version = "0.1.0"
description = "DARA — Distributed Architecture Root-cause Agent"
authors = ["DARA Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# --- API Framework ---
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
python-multipart = ">=0.0.9"
httpx = ">=0.27.0"

# --- Task Queue & Orchestration ---
celery = {extras = ["redis"], version = ">=5.3.0"}
redis = ">=5.0.0"
prefect = ">=2.19.0"
flower = ">=2.0.0"

# --- Database ---
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.0"}
alembic = ">=1.13.0"
asyncpg = ">=0.29.0"
psycopg2-binary = ">=2.9.9"

# --- Vector DB ---
qdrant-client = ">=1.9.0"

# --- Graph DB ---
neo4j = ">=5.0.0"

# --- Object Storage ---
minio = ">=7.2.0"

# --- LLM & AI ---
openai = ">=1.30.0"
groq = ">=0.9.0"
google-generativeai = ">=0.7.0"
sentence-transformers = ">=2.7.0"
tiktoken = ">=0.7.0"
torch = {version = ">=2.0.0", optional = true}

# --- Code Intelligence ---
tree-sitter = ">=0.21.0"
tree-sitter-python = ">=0.21.0"
tree-sitter-go = ">=0.21.0"
tree-sitter-typescript = ">=0.21.0"
semgrep = ">=1.70.0"
ruff = ">=0.4.0"
bandit = ">=1.7.9"
pyan3 = ">=1.1.1"
unidiff = ">=0.7.5"

# --- Sandbox / Container ---
testcontainers = ">=4.4.0"
docker = ">=7.0.0"

# --- GitHub Integration ---
pygithub = ">=2.3.0"
PyJWT = ">=2.8.0"
cryptography = ">=42.0.0"

# --- Slack Integration ---
slack-bolt = ">=1.18.0"
slack-sdk = ">=3.27.0"

# --- Observability ---
opentelemetry-sdk = ">=1.24.0"
opentelemetry-api = ">=1.24.0"
opentelemetry-exporter-otlp = ">=1.24.0"
opentelemetry-instrumentation-fastapi = ">=0.45b0"
opentelemetry-instrumentation-sqlalchemy = ">=0.45b0"
opentelemetry-instrumentation-redis = ">=0.45b0"
prometheus-client = ">=0.20.0"
prometheus-fastapi-instrumentator = ">=6.1.0"

# --- Utilities ---
python-dotenv = ">=1.0.0"
structlog = ">=24.1.0"
tenacity = ">=8.2.0"
python-jose = {extras = ["cryptography"], version = ">=3.3.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4"}
python-json-logger = ">=2.0.7"
orjson = ">=3.10.0"
anyio = ">=4.3.0"
scipy = ">=1.13.0"                    # Fisher exact test for A/B evaluation

[tool.poetry.dev-dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=5.0.0"
pytest-json-report = ">=1.5.0"
httpx = ">=0.27.0"
factory-boy = ">=3.3.0"
faker = ">=24.0.0"
hypothesis = ">=6.100.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-fail-under=30 --ignore=tests/test_e2e_smoke.py --ignore=tests/test_context.py"
filterwarnings = [
    "ignore::DeprecationWarning:asttokens",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
