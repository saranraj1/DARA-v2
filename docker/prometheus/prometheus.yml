global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dara-monitor'

scrape_configs:
  - job_name: 'dara-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
